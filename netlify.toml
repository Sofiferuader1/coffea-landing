
# CONFIGURACIÓN DE NETLIFY - COFFEA

[build]
  publish = "."

# HEADERS DE SEGURIDAD

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CACHÉ DE IMÁGENES E ÍCONOS

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=3600"

# CACHÉ DE ARCHIVOS CSS

[[headers]]
  for = "/css/*"

  [headers.values]
    Cache-Control = "public, max-age=3600"
